# Secrets が呼び出し元から見えているかだけを確かめる一時的なワークフロー。
# 切り分けが済んだら消す。値は出さず、長さだけ見る。

name: debug-secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 呼び出し元から見えるか
        env:
          B64:   ${{ secrets.SIGNING_PFX_BASE64 }}
          PASS:  ${{ secrets.SIGNING_PFX_PASSWORD }}
          THUMB: ${{ secrets.SIGNING_THUMBPRINT }}
        run: |
          # 値は出さない。長さだけ。0 なら見えていない。
          echo "SIGNING_PFX_BASE64   の長さ: ${#B64}"
          echo "SIGNING_PFX_PASSWORD の長さ: ${#PASS}"
          echo "SIGNING_THUMBPRINT   の長さ: ${#THUMB}"
          if [ "${#B64}" -eq 0 ]; then
            echo "-> 呼び出し元にも見えていない。Organization Secret の対象設定の問題"
          else
            echo "-> 呼び出し元には見えている。secrets: inherit の受け渡しの問題"
          fi
